{% extends 'journal/base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="glass-card p-5 text-center">
            <h2 class="section-title mb-3">🗑 Delete Entry</h2>
            <p class="muted-text mb-4">
                Are you sure you want to delete this entry?
            </p>

            <div class="glass-card p-3 mb-4">
                <h5 class="fw-bold">{{ entry.title }}</h5>
                <p class="muted-text mb-0">{{ entry.description|truncatewords:20 }}</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger px-4 rounded-pill">Yes, Delete</button>
                    <a href="{% url 'all_entries' %}" class="btn btn-soft">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
