<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurioLog</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8faff, #eef2ff);
            color: #1e293b;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(79, 70, 229, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.15);
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: white !important;
            font-size: 1.4rem;
        }

        .nav-btn {
            border-radius: 12px;
            font-weight: 600;
            padding: 8px 16px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(14px);
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .muted-text {
            color: #64748b;
        }

        .stat-card {
            padding: 24px;
            transition: 0.25s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-label {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            margin-top: 8px;
        }

        .entry-card {
            padding: 20px;
            transition: 0.25s ease;
        }

        .entry-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 34px rgba(79, 70, 229, 0.12);
        }

        .badge-soft {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .badge-type {
            background: #dcfce7;
            color: #166534;
        }

        .badge-category {
            background: #ede9fe;
            color: #5b21b6;
        }

        .badge-tag {
            background: #e0f2fe;
            color: #075985;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .btn-main {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 14px;
            padding: 10px 18px;
        }

        .btn-main:hover {
            opacity: 0.95;
            color: white;
        }

        .btn-soft {
            background: white;
            border: 1px solid #dbeafe;
            color: #334155;
            font-weight: 600;
            border-radius: 14px;
            padding: 10px 18px;
        }

        .form-control, .form-select {
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid #dbe3f0;
            box-shadow: none !important;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
        }

        .checkbox-container ul {
            list-style: none;
            padding-left: 0;
            margin-bottom: 0;
        }

        .checkbox-container li {
            margin-bottom: 10px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 14px;
        }

        .hero-box {
            padding: 28px;
            border-radius: 24px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            box-shadow: 0 16px 40px rgba(79, 70, 229, 0.25);
        }

        .hero-box h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .hero-box p {
            opacity: 0.95;
            margin-bottom: 0;
        }

        canvas {
            max-height: 300px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg px-4 py-3 mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'dashboard' %}">✨ CurioLog</a>
        <div class="d-flex gap-2">
            <a href="{% url 'dashboard' %}" class="btn btn-light nav-btn">Dashboard</a>
            <a href="{% url 'add_entry' %}" class="btn btn-outline-light nav-btn">+ New Entry</a>
            <a href="{% url 'export_csv' %}" class="btn btn-outline-light nav-btn">Export CSV</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}{% endblock %}
</div>

</body>
</html>
